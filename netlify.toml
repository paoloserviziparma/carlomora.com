[build]
  publish = "public"
  command = ""

# --- vecchi indirizzi del sito Wix -----------------------------------------
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/cookie-policy"
  to = "/cookie/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/filosofia"
  to = "/#filosofia"
  status = 301

[[redirects]]
  from = "/contatti"
  to = "/#contatti"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/"
  status = 301

[[redirects]]
  from = "/shop/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/product-page/*"
  to = "/"
  status = 301

# dominio senza www -> www
[[redirects]]
  from = "https://carlomora.com/*"
  to = "https://www.carlomora.com/:splat"
  status = 301
  force = true

# --- intestazioni di sicurezza ---------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# --- cache ------------------------------------------------------------------
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
